# Azure Pipeline for Playwright Tests with Microsoft Playwright Testing
# This pipeline runs Playwright tests on Azure cloud browsers

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - "*.md"

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: 'Azure Pipelines'
  vmImage: 'ubuntu-latest'

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: PLAYWRIGHT_SERVICE_URL
    value: 'wss://eastasia.api.playwright.microsoft.com/playwrightworkspaces/4247ea18-110c-4652-b24a-5eef04f21c32/browsers'
  - name: TEST_ENV
    value: 'production'
  # TEST_USER_EMAIL and TEST_USER_PASSWORD should be set as Secret variables in Azure DevOps

stages:
  - stage: Test
    displayName: 'Run Playwright Tests'
    jobs:
      - job: PlaywrightTests
        displayName: 'Execute Playwright Test Suite'
        timeoutInMinutes: 60

        steps:
          # Install Node.js
          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          # Install dependencies
          - script: npm ci
            displayName: 'Install npm dependencies'
            workingDirectory: $(Build.SourcesDirectory)

          # Install Playwright browsers (for local fallback if Azure service fails)
          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          # Create .env file with credentials
          - task: Bash@3
            displayName: 'Create .env file for tests'
            inputs:
              targetType: 'inline'
              script: |
                echo "Creating .env file with credentials..."
                
                # Debug: Check if variables are set
                if [ -z "$(TEST_USER_EMAIL)" ]; then
                  echo "ERROR: TEST_USER_EMAIL is not set in Azure DevOps pipeline variables!"
                  exit 1
                fi
                
                if [ -z "$(TEST_USER_PASSWORD)" ]; then
                  echo "ERROR: TEST_USER_PASSWORD is not set in Azure DevOps pipeline variables!"
                  exit 1
                fi

                # Create .env file using echo statements
                echo "TEST_ENV=$(TEST_ENV)" > .env
                echo "TEST_USER_EMAIL=$(TEST_USER_EMAIL)" >> .env
                echo "TEST_USER_PASSWORD=$(TEST_USER_PASSWORD)" >> .env
                echo "PLAYWRIGHT_SERVICE_URL=$(PLAYWRIGHT_SERVICE_URL)" >> .env
                echo "PLAYWRIGHT_SERVICE_ACCESS_TOKEN=$(PLAYWRIGHT_SERVICE_ACCESS_TOKEN)" >> .env
                echo "BASE_URL=https://eventhub.rahulshettyacademy.com" >> .env
                echo "API_BASE_URL=https://api.eventhub.rahulshettyacademy.com" >> .env
                echo "RUN_PARALLEL=true" >> .env

                echo "✓ .env file created"
                echo "Verifying required variables..."
                grep -E "TEST_USER_EMAIL|TEST_USER_PASSWORD|PLAYWRIGHT_SERVICE_URL" .env | sed 's/PASSWORD=.*/PASSWORD=***/' | sed 's/TOKEN=.*/TOKEN=***/' || echo "ERROR: Required variables not found in .env"

          # Run Playwright Tests with Azure Service
          - task: Bash@3
            displayName: 'Run Playwright Tests on Azure'
            continueOnError: true
            inputs:
              targetType: 'inline'
              script: |
                echo "Running Playwright tests with Microsoft Playwright Testing..."
                echo "Test Environment: $(TEST_ENV)"

                # .env file is already created in previous step
                # Playwright will load it via dotenv in ConfigManager

                # Run tests using service config
                npx playwright test --config=playwright.service.config.ts --workers=10

          # Publish test results (if using JUnit reporter)
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/**/*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true
              testRunTitle: 'Playwright Tests - $(Build.BuildNumber)'

          # Publish HTML report (only if exists)
          - script: |
              if [ -d "playwright-report" ]; then
                echo "##vso[task.setvariable variable=REPORT_EXISTS]true"
              fi
            displayName: 'Check if HTML report exists'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright HTML Report'
            condition: and(succeededOrFailed(), eq(variables.REPORT_EXISTS, 'true'))
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report-$(System.JobAttempt)'
              publishLocation: 'pipeline'

          # Publish Allure results (only if exists)
          - script: |
              if [ -d "allure-results" ]; then
                echo "##vso[task.setvariable variable=ALLURE_EXISTS]true"
              fi
            displayName: 'Check if Allure results exist'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Allure Results'
            condition: and(succeededOrFailed(), eq(variables.ALLURE_EXISTS, 'true'))
            inputs:
              targetPath: 'allure-results'
              artifact: 'allure-results-$(System.JobAttempt)'
              publishLocation: 'pipeline'

          # Publish test artifacts (screenshots, videos, traces) - only if exists
          - script: |
              if [ -d "test-results" ]; then
                echo "##vso[task.setvariable variable=TEST_RESULTS_EXISTS]true"
              fi
            displayName: 'Check if test results exist'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Test Artifacts'
            condition: and(succeededOrFailed(), eq(variables.TEST_RESULTS_EXISTS, 'true'))
            inputs:
              targetPath: 'test-results'
              artifact: 'test-artifacts-$(System.JobAttempt)'
              publishLocation: 'pipeline'

          # Display summary
          - script: |
              echo "========================================="
              echo "Test Execution Summary"
              echo "========================================="
              echo "Build Number: $(Build.BuildNumber)"
              echo "Build ID: $(Build.BuildId)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Commit: $(Build.SourceVersion)"
              echo "========================================="
            displayName: 'Display Test Summary'
            condition: always()
